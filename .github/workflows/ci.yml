name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Validate Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Verify code formatting
        run: npm run format:check

      - name: Run static code analysis (lint)
        run: npm run lint

      - name: Verify TypeScript compilation & project references
        run: npm run typecheck

      - name: Execute complete test suite (unit, contract, security rules)
        run: npm test
